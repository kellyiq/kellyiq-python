[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kellyiq"
dynamic = ["version"]
description = "Size a whole sports betting slate as one portfolio: a client for the KellyIQ API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "KellyIQ", email = "opensource@kellyiq.com" }]
keywords = ["kelly criterion", "bet sizing", "sports betting", "portfolio optimization", "bankroll"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://www.kellyiq.com/developers"
Documentation = "https://www.kellyiq.com/developers/quickstart"
Source = "https://github.com/kellyiq/kellyiq-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kellyiq = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "kellyiq._version.__version__" }
